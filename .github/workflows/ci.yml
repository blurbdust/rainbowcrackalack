name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

# Same-repo pull requests fire both push and pull_request, and pushing again
# supersedes a run in flight.  Keep one run per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux build and Net-NTLMv1 tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # pocl is a CPU OpenCL implementation.  GitHub-hosted runners have no GPU,
      # but the kernels are plain OpenCL C, so they run correctly on a CPU ICD.
      - name: Install build and OpenCL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 clinfo \
            ocl-icd-opencl-dev opencl-headers pocl-opencl-icd \
            libgcrypt20-dev libunrar-dev

      # Build the configuration users actually ship, so a GPU-only build break
      # is still caught even though CI cannot run those binaries.
      - name: Build (default GPU configuration)
        run: make -j"$(nproc)"

      - name: Rebuild against CPU OpenCL
        run: |
          make clean
          make -j"$(nproc)" CPU_OPENCL=1

      - name: Show OpenCL devices
        run: clinfo --list

      # Runs every suite, including "manytables": one lookup across 64 table
      # parts, which is the only suite that can see a resource leak accumulating
      # from one table to the next.  Under pocl it exercises the OpenCL backend;
      # the same suite reproduces the CUDA failure when run on a GPU box.
      - name: Net-NTLMv1 correctness tests
        run: python3 tests/test_netntlmv1.py

      # Batched pre-computation must be a pure speedup, so its cache files have
      # to be byte-identical to the one-hash-at-a-time path's.  Everything
      # downstream reads them, so a divergence here would silently corrupt
      # results rather than fail loudly.
      - name: Pre-compute batching equivalence
        run: python3 tests/test_precompute_batch.py --chain-len 2000

  cuda-backend:
    name: CUDA backend (stub driver, no GPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      # GitHub-hosted runners have no GPU and no CUDA toolkit, so the CUDA
      # backend used to get zero CI coverage of any kind.  That is how a
      # fixed-size kernel arg table shipped a crash that only appeared ~32
      # tables into a real lookup run.  tests/cuda_stub/ fakes the driver so the
      # host-side bookkeeping in cuda_setup.c can be tested anywhere.
      - name: CUDA host-logic tests against the stub driver
        run: tests/run_cuda_stub_tests.sh

  windows-cross:
    name: Windows cross-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential mingw-w64 opencl-headers libgcrypt-mingw-w64-dev

      # Ubuntu has no mingw build of libunrar, so the windows target defaults to
      # UNRAR=0 and RAR tables report a clear error at runtime.
      - name: Cross-build for Windows
        run: make windows

      # A green build is not enough: the link step used to fail partway through
      # and leave a subset of the binaries behind.
      - name: Check every binary was produced
        run: |
          set -eu
          missing=0
          for exe in crackalack_gen crackalack_lookup crackalack_rtc2rt \
                     crackalack_unit_tests crackalack_verify enumerate_chain \
                     get_chain perfectify; do
            if [ -f "$exe.exe" ]; then
              echo "  OK      $exe.exe"
            else
              echo "  MISSING $exe.exe"
              missing=1
            fi
          done
          exit $missing
